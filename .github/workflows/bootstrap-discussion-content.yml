name: Create initial Discussions content

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-discussion-content.yml

permissions:
  contents: write
  discussions: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Create welcome and search discussions
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          OWNER="${REPOSITORY%%/*}"
          NAME="${REPOSITORY#*/}"

          DATA="$(gh api graphql \
            -f query='query($owner:String!,$name:String!){repository(owner:$owner,name:$name){id hasDiscussionsEnabled discussionCategories(first:30){nodes{id name slug}} discussions(first:50){nodes{title url}}}}' \
            -f owner="$OWNER" \
            -f name="$NAME")"

          ENABLED="$(jq -r '.data.repository.hasDiscussionsEnabled' <<<"$DATA")"
          test "$ENABLED" = "true"

          REPOSITORY_ID="$(jq -r '.data.repository.id' <<<"$DATA")"
          GENERAL_ID="$(jq -r '.data.repository.discussionCategories.nodes[] | select(.slug == "general") | .id' <<<"$DATA" | head -n 1)"
          ANNOUNCEMENTS_ID="$(jq -r '.data.repository.discussionCategories.nodes[] | select(.slug == "announcements") | .id' <<<"$DATA" | head -n 1)"
          QA_ID="$(jq -r '.data.repository.discussionCategories.nodes[] | select(.slug == "q-a") | .id' <<<"$DATA" | head -n 1)"

          [ -n "$GENERAL_ID" ] && [ "$GENERAL_ID" != "null" ]
          if [ -z "$ANNOUNCEMENTS_ID" ] || [ "$ANNOUNCEMENTS_ID" = "null" ]; then ANNOUNCEMENTS_ID="$GENERAL_ID"; fi
          if [ -z "$QA_ID" ] || [ "$QA_ID" = "null" ]; then QA_ID="$GENERAL_ID"; fi

          create_if_missing() {
            local title="$1"
            local body="$2"
            local category_id="$3"
            local existing
            existing="$(jq -r --arg title "$title" '.data.repository.discussions.nodes[] | select(.title == $title) | .url' <<<"$DATA" | head -n 1)"
            if [ -n "$existing" ]; then
              printf '%s\n' "$existing"
              return
            fi

            gh api graphql \
              -f query='mutation($repositoryId:ID!,$categoryId:ID!,$title:String!,$body:String!){createDiscussion(input:{repositoryId:$repositoryId,categoryId:$categoryId,title:$title,body:$body}){discussion{url}}}' \
              -f repositoryId="$REPOSITORY_ID" \
              -f categoryId="$category_id" \
              -f title="$title" \
              -f body="$body" \
              --jq '.data.createDiscussion.discussion.url'
          }

          WELCOME_URL="$(create_if_missing \
            '라그하임 기억·자료 토론 게시판을 열었습니다' \
            $'초기 라그하임의 기억, 스크린샷, 지역판 차이, 배포 경로와 소문을 자유롭게 이야기하는 공간입니다.\n\n- Discussions: 자유로운 대화와 기억 공유\n- Issues: 자료 식별과 검증 상태의 장기 기록\n- 익명 제보: GitHub 계정을 쓰지 않거나 출처 공개를 원하지 않는 경우\n\n대화 중 의미 있는 단서가 확인되면 별도의 Issue로 옮겨 출처와 검증 상태를 관리합니다. 실행파일·설치본·패치·서버파일은 공개 첨부하지 마십시오.' \
            "$ANNOUNCEMENTS_ID")"

          SEARCH_URL="$(create_if_missing \
            '2001 CBT~2002 ERA-A 자료와 기억을 찾습니다' \
            $'현재 수색 우선순위는 다음과 같습니다.\n\n1. 절대 최우선: 2001년 7월 클로즈베타와 Laghaim1212.exe 이전 전 자료\n2. 준최우선: 1212 이후부터 2002-05-28 ERA-A 종료 경계까지의 클라이언트·패치 전량\n3. 고급 비교자료: 2002년 나머지 한국 클라이언트·패치·설치매체\n\n1212는 종착점이 아니라 기준 앵커입니다. 초기 샤일론·초기 천공처럼 처음 도입된 상태가 후속 패치에서 바뀌면 특정 중간 버전에만 원형이 남을 수 있습니다.\n\n당시 플레이 기억, 스크린샷, 잡지 부록 CD, PC방 설치본, 파일명·크기·날짜·폴더 목록만으로도 단서가 됩니다. 불확실한 기억도 직접기억·전언·추론을 구분해 남겨 주십시오.' \
            "$QA_ID")"

          RESULT=$(cat <<EOF
          # Discussions bootstrap result

          - Status: success
          - Welcome discussion: $WELCOME_URL
          - ERA-A search discussion: $SEARCH_URL
          - Generated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF
          )

          ENCODED="$(printf '%s\n' "$RESULT" | base64 -w 0)"
          gh api --method PUT "repos/$REPOSITORY/contents/.github/DISCUSSIONS_BOOTSTRAP_RESULT.md" \
            -f message='Record initial Discussions creation' \
            -f content="$ENCODED" \
            -f branch='main'
